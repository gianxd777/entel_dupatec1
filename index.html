<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b2a">
  <title>Tienda Entel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"><i></i><i></i><i></i></div>

  <header class="top">
    <button id="btnAtras" class="atras hidden">← Atrás</button>
    <div class="logo" id="logo">📱 Tienda Entel</div>
    <div class="sp"></div>
    <a class="wa-top" href="https://wa.me/51902715491" target="_blank" rel="noopener">💬 WhatsApp</a>
  </header>

  <main>
    <!-- INICIO -->
    <section id="home" class="view active">
      <div class="hero">
        <h2>Tu celular, tu línea,<br><span class="grad">sin complicaciones</span></h2>
        <p>Registra tu equipo, compra al contado o en cuotas.</p>
      </div>

      <!-- CARRUSEL -->
      

      <div class="cards">
        <button class="card tilt rip" data-go="lista">
          <span class="ico">✅</span>
          <b>Registro en lista blanca</b>
          <small>Registra o desbloquea tu equipo</small>
        </button>
        <button class="card tilt rip" data-go="cuotas">
          <span class="ico">💳</span>
          <b>Celulares a cuotas</b>
          <small>Entel · Payjoy · Efectiva · Alo Crédi</small>
        </button>
        <button class="card tilt rip" data-go="contado">
          <span class="ico">💵</span>
          <b>Celulares al contado</b>
          <small>Liberados para cualquier operador</small>
        </button>
      </div>
    </section>

    <!-- LISTA BLANCA -->
    <section id="lista" class="view">
      <h2 class="titulo">Registro en lista blanca</h2>
      <div id="wizard" class="panel"></div>
    </section>

    <!-- CONTADO: elegir modo -->
    <section id="contado" class="view">
      <h2 class="titulo">Celulares al contado</h2>
      <p class="sub">¿Cómo quieres comprar?</p>
      <div class="cards">
        <button class="card tilt rip" data-modo="tienda">
          <span class="ico">🏬</span><b>Comprar en tienda</b><small>Te atendemos por WhatsApp</small>
        </button>
        <button class="card tilt rip" data-modo="online">
          <span class="ico">🚚</span><b>Comprar online</b><small>Envíos a nivel nacional</small>
        </button>
      </div>
    </section>

    <!-- CONTADO: catálogo -->
    <section id="contadoCat" class="view">
      <h2 class="titulo">Celulares al contado</h2>
      <p class="sub" id="modoTxt"></p>
      <div id="boxEnvio" class="panel hidden">
        <label class="lbl">📍 Tu lugar de envío</label>
        <input id="lugarEnvio" type="text" placeholder="Ciudad, distrito y dirección">
      </div>
      <div id="chipsContado" class="chips"></div>
      <div id="gridContado" class="grid"></div>
    </section>

    <!-- CUOTAS: elegir proveedor -->
    <section id="cuotas" class="view">
      <h2 class="titulo">Celulares a cuotas</h2>
      <p class="sub">Elige con quién quieres comprar</p>
      <div class="provs">
        <button class="prov tilt rip p-entel" data-prov="entel">
          <span class="plogo">entel</span>
          <span class="psub">Compra en cuotas con Entel</span>
          <span class="go">Ver celulares →</span>
        </button>
        <button class="prov tilt rip p-payjoy" data-prov="payjoy">
          <span class="plogo">Payjoy</span>
          <span class="psub">Compra en cuotas con Payjoy</span>
          <span class="go">Ver celulares →</span>
        </button>
        <button class="prov tilt rip p-efectiva" data-prov="efectiva">
          <span class="plogo">Efectiva</span>
          <span class="psub">Compra en cuotas con Efectiva</span>
          <span class="go">Ver celulares →</span>
        </button>
        <button class="prov tilt rip p-alocredi" data-prov="alocredi">
          <span class="plogo">Alo Crédi</span>
          <span class="psub">Compra en cuotas con Alo Crédi</span>
          <span class="go">Ver celulares →</span>
        </button>
      </div>
    </section>

    <!-- CUOTAS: catálogo -->
    <section id="cuotasCat" class="view">
      <div id="provBanner" class="banner"></div>
      <div id="chipsCuotas" class="chips"></div>
      <div id="gridCuotas" class="grid"></div>
    </section>
  </main>

  <div class="carrusel" id="carrusel">
        <div class="car-track" id="carTrack"></div>
        <button class="car-btn prev" id="carPrev" aria-label="Anterior">‹</button>
        <button class="car-btn next" id="carNext" aria-label="Siguiente">›</button>
        <div class="car-dots" id="carDots"></div>
      </div>

  <a class="wafab" href="https://wa.me/51902715491" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>

  <script src="script.js"></script>
</body>
</html>
